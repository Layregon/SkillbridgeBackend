spring.application.name=skillbridge

# Conexion a MySQL. La BBDD entregada se llama gestion_competencias.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_competencias\
 ?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate. En desarrollo usamos update, igual que en el curso.
# En produccion se recomienda arrancar con ddl-auto=validate o none.
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Carga demo tipo CommandLineRunner. Si se importa el SQL completo no duplica datos.
app.datos-iniciales=${DATOS_INICIALES:true}

# JWT. Sustituir JWT_SECRET en un entorno real.
app.jwt.secret=${JWT_SECRET:skillbridge-clave-demo-2026-muy-larga-para-hs256-segura}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}
